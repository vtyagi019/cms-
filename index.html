<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techtrix 2026 Portal | E-Cell</title>
<style>
:root{--bg:#f6f9fc;--fg:#14202e;--mut:#5b6b7c;--card:#fff;--line:#dce6f0;--b1:#0b5ed7;--ok:#128a4a;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--fg:#e6eef7;--mut:#9bb0c4;--card:#142233;--line:#243a52}}
:root[data-theme="dark"]{--bg:#0d1520;--fg:#e6eef7;--mut:#9bb0c4;--card:#142233;--line:#243a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header img{height:42px;background:#fff;border-radius:6px;padding:2px}header b{margin-right:auto;color:var(--b1)}
button,select,input,textarea{font:inherit;border-radius:6px;border:1px solid var(--line);padding:6px 10px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.p,button.on{background:var(--b1);color:#fff;border-color:var(--b1)}
textarea{width:100%;min-height:110px}
main{max-width:960px;margin:0 auto;padding:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sc{overflow-x:auto}
.deliverable-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.deliverable-count{white-space:nowrap}
table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b1)}
.t{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--line)}.done{background:var(--ok);color:#fff}.od{color:var(--bad);font-weight:600}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;text-align:center}.k b{font-size:1.6rem;display:block;color:var(--b1)}
.lg{max-width:400px;margin:6vh auto;padding:14px;text-align:center}.lg img{width:200px;max-width:70%}.lg input{width:100%;margin:5px 0}
.mut{color:var(--mut);font-size:.85rem}.err{color:var(--bad);min-height:1.3em}
</style></head><body><div id="app"></div>

const D=["Creative","Vice President 1","Vice President 2","PR & Relations","Administration","Student Relations"];
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),today=day(0);
const SL={todo:"To Do",prog:"In Progress",review:"In Review",done:"Done"};
let db={users:[],tasks:[],outs:[],posts:[]};
let S={user:null,view:"dash",msg:"",rep:"",ready:false,connectionError:false};
// Write only the row each action changed. Upserting the whole dataset needs
// UPDATE policies on every table (upsert = INSERT ... ON CONFLICT DO UPDATE),
// which the demo schema does not grant for users/posts.
const run=async(make,msg)=>{
  try{
    const {error}=await make();
    if(error) throw error;
    return true;
  }catch(e){
    console.error("Supabase save error",e);
    S.msg=msg||"Could not save to Supabase. Check connection and table policies.";
    try{await loadRemote()}catch{}
    return false;
  }
};
const rowUser=u=>({id:u.id,name:u.name,role:u.role,dept:u.dept,password_hash:u.pw});
const rowTask=t=>({id:t.id,title:t.title,dept:t.dept,assignee_id:t.as,due:t.due,status:t.status,priority:t.pri});
const rowPost=p=>({id:p.id,by_user_id:p.by,dept:p.dept,title:p.title,body:p.body,ts:new Date(p.ts).toISOString()});
const write={
  userAdd:u=>run(()=>sb.from("portal_users").insert(rowUser(u)),"Could not save the new member to Supabase."),
  taskAdd:t=>run(()=>sb.from("portal_tasks").insert(rowTask(t))),
  taskSet:t=>run(()=>sb.from("portal_tasks").update(rowTask(t)).eq("id",t.id)),
  postAdd:p=>run(()=>sb.from("portal_posts").insert(rowPost(p))),
  postDel:id=>run(()=>sb.from("portal_posts").delete().eq("id",id))
};
const loadRemote=async()=>{
  if(!sb) throw new Error("Supabase URL and publishable key are required.");
  const [u,t,o,p]=await Promise.all([
    sb.from("portal_users").select("id,name,role,dept,password_hash"),
    sb.from("portal_tasks").select("id,title,dept,assignee_id,due,status,priority"),
    sb.from("portal_outputs").select("id,dept,title,target,current_value"),
    sb.from("portal_posts").select("id,by_user_id,dept,title,body,ts")
  ]);
  const failure=[u,t,o,p].find(result=>result.error);
  if(failure) throw failure.error;
  db={
    users:(u.data||[]).map(x=>({id:x.id,name:x.name,role:x.role,dept:x.dept,pw:x.password_hash})),
    tasks:(t.data||[]).map(x=>({id:x.id,title:x.title,dept:x.dept,as:x.assignee_id,due:x.due,status:x.status,pri:x.priority})),
    outs:(o.data||[]).map(x=>({id:x.id,dept:x.dept,title:x.title,target:x.target,cur:x.current_value})),
    posts:(p.data||[]).map(x=>({id:x.id,by:x.by_user_id,dept:x.dept,title:x.title,body:x.body,ts:new Date(x.ts).getTime()}))
  };
};
const connectRemote=async()=>{
  S.ready=false;S.connectionError=false;S.msg="Connecting to Supabase...";app();
  try{await loadRemote();S.msg=""}
  catch(e){console.error("Supabase load error",e);S.connectionError=true;S.msg="Could not load Supabase data. Check URL, key and table policies."}
  S.ready=true;app();
};
const me=id=>db.users.find(u=>u.id===id)||{name:"(removed)",dept:""};
const mem=d=>db.users.filter(x=>x.role==="member"&&x.dept===d);
const vis=()=>{const u=S.user;return db.tasks.filter(t=>u.role==="admin"||(u.role==="head"?t.dept===u.dept:t.as===u.id))};
const pct=a=>a.length?Math.round(a.filter(t=>t.status==="done").length*100/a.length):0;
const deliverables=d=>{const tasks=db.tasks.filter(t=>t.dept===d);return {completed:tasks.filter(t=>t.status==="done").length,total:tasks.length}};
const od=t=>t.status!=="done"&&t.due<today;
const roleOf=u=>u.role==="admin"?"Admin":u.role==="head"?"Head, "+u.dept:"Member, "+u.dept;
function login(){return `<div class="lg"><img src="${LOGO}" alt="E-Cell"><h2 style="color:var(--b1);margin:6px 0">Techtrix 2026</h2><p class="mut">Sign in with your user ID.</p><div class="c"><form data-f="login"><input name="id" placeholder="User ID" autocomplete="username" required><input name="pw" type="password" placeholder="Password" autocomplete="current-password" required><div class="err">${esc(S.msg)}</div><button class="p">Sign in</button></form></div></div>`}
function act(t){const u=S.user,own=t.as===u.id,lead=u.role!=="member",s=t.status,d=`data-a="mv" data-id="${t.id}"`;let b="";
if((own||lead)&&s==="todo")b=`<button ${d} data-s="prog">Start</button>`;
if((own||lead)&&s==="prog")b=`<button ${d} data-s="review">Submit for review</button>`;
if(lead&&s==="review")b=`<button class="p" ${d} data-s="done">Approve</button> <button ${d} data-s="prog">Send back</button>`;
return b}
function tasksV(){const u=S.user,L=vis().sort((a,b)=>a.due.localeCompare(b.due)),lead=u.role!=="member";
const ms=db.users.filter(x=>x.role==="member"&&(u.role==="admin"||x.dept===u.dept));
const add=!lead?"":`<div class="c"><b>Create and assign a task</b>${ms.length?`<form data-f="task" class="row" style="margin-top:8px"><input name="title" placeholder="Task title" required maxlength="120" style="flex:2;min-width:180px"><select name="as">${ms.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}${u.role==="admin"?" ("+esc(m.dept)+")":""}</option>`).join("")}</select><input name="due" type="date" value="${day(7)}" required><select name="pri"><option>High</option><option selected>Med</option><option>Low</option></select><button class="p">Assign</button></form>`:`<p class="mut">No members yet. Add members in the Team tab first.</p>`}</div>`;
const who=t=>lead?`<select data-a="assign" data-id="${t.id}">${mem(t.dept).map(m=>`<option value="${esc(m.id)}" ${m.id===t.as?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`:esc(me(t.as).name);
return add+`<div class="c sc"><table><tr><th>Task</th><th>Assignee</th><th>Due</th><th>Status</th><th></th></tr>${L.map(t=>`<tr><td>${esc(t.title)}<div class="mut">${esc(t.dept)} · ${t.pri}</div></td><td>${who(t)}</td><td class="${od(t)?"od":""}">${t.due}${od(t)?" (overdue)":""}</td><td><span class="t ${t.status==="done"?"done":""}">${SL[t.status]}</span></td><td>${act(t)}</td></tr>`).join("")||"<tr><td colspan=5>No tasks yet.</td></tr>"}</table></div>`}
function dashV(){const u=S.user,L=vis(),ds=u.role==="admin"?D:[u.dept];
const k=`<div class="c k"><div><b>${pct(L)}%</b>Complete</div><div><b>${L.length}</b>Tasks</div><div><b>${L.filter(od).length}</b>Overdue</div><div><b>${L.filter(t=>t.status==="review").length}</b>In review</div></div>`;
if(u.role==="member")return `<h3>My Portal</h3>`+k+`<h3>My tasks</h3>`+tasksV();
return k+ds.map(d=>{const tasks=db.tasks.filter(t=>t.dept===d),p=pct(tasks),output=deliverables(d);return `<div class="c"><div class="row"><b style="flex:1">${esc(d)}</b><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="deliverable-row"><span>Key deliverables completed:</span><b class="deliverable-count">${output.completed} / ${output.total}</b></div></div>`}).join("")}
function postV(){const u=S.user,P=db.posts.filter(p=>u.role==="admin"||(u.role==="head"?p.dept===u.dept:p.by===u.id)).sort((a,b)=>b.ts-a.ts);
return `<div class="c"><b>Write today's feedback</b><form data-f="post" style="margin-top:8px"><input name="title" placeholder="Title" required maxlength="100" style="width:100%;margin-bottom:6px"><textarea name="body" placeholder="What did you work on today? Challenges, wins, plans for tomorrow..." required maxlength="3000"></textarea><button class="p">Publish</button></form></div><h3>${u.role==="member"?"My posts":"Team feedback"}</h3>`+(P.map(p=>`<div class="c"><b>${esc(p.title)}</b><div class="mut">${esc(me(p.by).name)} · ${esc(p.dept||"Admin")} · ${new Date(p.ts).toLocaleString("en-IN")}</div><p style="white-space:pre-wrap">${esc(p.body)}</p>${p.by===u.id||u.role==="admin"?`<button data-a="delpost" data-id="${p.id}">Delete</button>`:""}</div>`).join("")||`<p class="mut">No posts yet.</p>`)}
function teamV(){const u=S.user,L=db.users.filter(x=>u.role==="admin"||(x.dept===u.dept&&x.role==="member"));
return `<div class="c"><b>Add a member</b><form data-f="member" class="row" style="margin-top:8px"><input name="name" placeholder="Full name" required maxlength="60"><input name="id" placeholder="User ID (a-z, 0-9, .)" required pattern="[a-z0-9._]{3,20}"><input name="pw" placeholder="Password (min 6)" required minlength="6" maxlength="40">${u.role==="admin"?`<select name="dept">${D.map(d=>`<option>${esc(d)}</option>`).join("")}</select>`:""}<button class="p">Add</button></form><div class="err">${esc(S.msg)}</div></div><div class="c sc"><table><tr><th>Name</th><th>User ID</th><th>Role</th></tr>${L.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.id)}</td><td>${esc(roleOf(x))}</td></tr>`).join("")}</table></div>`}
function repV(){const u=S.user,ds=u.role==="admin"?D:[u.dept];let tx=`TECHTRIX 2026 PROGRESS REPORT (${today})\n`;
const body=ds.map(d=>{const dl=db.tasks.filter(t=>t.dept===d),output=deliverables(d);tx+=`\n${d}: ${pct(dl)}% done, ${dl.filter(od).length} overdue\n`;
const rows=mem(d).map(m=>{const x=dl.filter(t=>t.as===m.id),f=db.posts.filter(p=>p.by===m.id).length;tx+=`  - ${m.name}: ${x.filter(t=>t.status==="done").length}/${x.length} done, ${f} feedback posts\n`;return `<tr><td>${esc(m.name)}</td><td>${x.length}</td><td>${x.filter(t=>t.status==="done").length}</td><td>${x.filter(od).length}</td><td>${f}</td></tr>`}).join("");
tx+=`  Key deliverables completed: ${output.completed}/${output.total} tasks\n`;
return `<div class="c sc"><b>${esc(d)}</b> <span class="mut">${pct(dl)}% complete</span><table><tr><th>Member</th><th>Assigned</th><th>Done</th><th>Overdue</th><th>Posts</th></tr>${rows||"<tr><td colspan=5>No members</td></tr>"}</table></div>`}).join("");S.rep=tx;
return `<div class="row"><button class="p" data-a="copy">Copy report text</button><span class="mut" id="cm"></span></div>`+body}
function app(){const u=S.user,A=document.getElementById("app");if(S.connectionError){A.innerHTML=`<main class="lg"><h2>Supabase connection required</h2><p class="err">${esc(S.msg)}</p><button class="p" data-a="retry">Retry connection</button></main>`;return}if(!S.ready){A.innerHTML=`<main class="lg"><p class="mut">${esc(S.msg||"Connecting to Supabase...")}</p></main>`;return}if(!u){A.innerHTML=login();return}
const tabs=u.role==="member"?[["dash","My Portal"],["post","Daily Feedback"]]:[["dash","Dashboard"],["tasks","Tasks"],["post","Feedback"],["team","Team"],["rep","Report"]];
if(!tabs.some(t=>t[0]===S.view))S.view="dash";
const v={dash:dashV,tasks:tasksV,post:postV,team:teamV,rep:repV}[S.view]();
A.innerHTML=`<header><img src="${LOGO}" alt="E-Cell"><b>Techtrix 2026</b>${tabs.map(([k,n])=>`<button data-a="nav" data-v="${k}" class="${S.view===k?"on":""}">${n}</button>`).join("")}<button data-a="out2">Sign out</button></header><main><p class="mut">Welcome, <b>${esc(u.name)}</b> (${esc(roleOf(u))})</p>${v}</main>`}
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),u=S.user,k=f.dataset.f;S.msg="";
if(k==="login"){
  const id=String(d.id||"").trim().toLowerCase(),x=db.users.find(x=>String(x.id).trim().toLowerCase()===id),hp=await hashPassword(d.pw);
  if(x&&String(x.pw||"").toLowerCase()===hp){S.user=x;S.view="dash"}
  else S.msg="Invalid user ID or password.";
}
if(k==="task"&&u?.role!=="member"){const a=db.users.find(x=>x.id===d.as&&x.role==="member");if(a&&(u.role==="admin"||a.dept===u.dept)){const t={id:Date.now(),title:d.title.trim().slice(0,120),dept:a.dept,as:a.id,due:d.due,status:"todo",pri:d.pri};db.tasks.push(t);await write.taskAdd(t)}}
if(k==="post"&&u&&d.title.trim()&&d.body.trim()){const p={id:Date.now(),by:u.id,dept:u.dept,title:d.title.trim().slice(0,100),body:d.body.trim().slice(0,3000),ts:Date.now()};db.posts.push(p);await write.postAdd(p)}
if(k==="member"&&u&&u.role!=="member"){const dept=u.role==="admin"?d.dept:u.dept,id=d.id.trim();
if(!/^[a-z0-9._]{3,20}$/.test(id)||!D.includes(dept))S.msg="Invalid ID or department.";else if(db.users.some(x=>String(x.id).toLowerCase()===id.toLowerCase()))S.msg="That User ID already exists.";else{const nu={id,name:d.name.trim().slice(0,60),role:"member",dept,pw:await hashPassword(d.pw)};db.users.push(nu);await write.userAdd(nu)}}
app()});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;const a=b.dataset.a,u=S.user;S.msg="";
if(a==="retry"){await connectRemote();return}
if(a==="nav")S.view=b.dataset.v;
if(a==="out2"){S.user=null}
if(a==="mv"){const t=db.tasks.find(t=>t.id==b.dataset.id),s=b.dataset.s;if(t&&(t.as===u.id||u.role==="admin"||(u.role==="head"&&t.dept===u.dept))&&(s!=="done"||u.role!=="member")){t.status=s;await write.taskSet(t)}}
if(a==="delpost"){const p=db.posts.find(p=>p.id==b.dataset.id);if(p&&(p.by===u.id||u.role==="admin")){db.posts=db.posts.filter(x=>x!==p);await write.postDel(p.id)}}
if(a==="copy"){try{await navigator.clipboard.writeText(S.rep);document.getElementById("cm").textContent="Copied."}catch(x){document.getElementById("cm").textContent="Copy blocked by browser."}return}
app()});
document.addEventListener("change",async e=>{const el=e.target,u=S.user;if(!u)return;let changed=false;
if(el.dataset.a==="assign"){const t=db.tasks.find(t=>t.id==el.dataset.id),m=db.users.find(x=>x.id===el.value);if(t&&m&&m.dept===t.dept&&(u.role==="admin"||u.dept===t.dept)){t.as=m.id;await write.taskSet(t);changed=true}}
if(changed)app()});
connectRemote();
</script></body></html>
